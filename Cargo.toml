[workspace]
resolver = "1"
members = [
    "curvefever_game",
    "curvefever_remote",
    "curvefever_common",
    "curvefever_derive",
]

[workspace.dependencies]
curvefever_common = { path = "curvefever_common" }
curvefever_derive = { path = "curvefever_derive" }

anyhow = "1.0"
egui = "0.32.3"
eframe = "0.32.3"
tokio = { version = "1.47.1", features = ["rt", "macros"] }
axum = { version = "0.8.6", features = ["ws"] }
async-channel = "2.5.0"
futures-util = "0.3.31"
rand = "0.9.2"
getrandom = "0.3.3"

[profile.release]
strip = true
